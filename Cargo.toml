[package]
name = "astapa"
version = "0.6.4"
edition = "2021"
description = "Postgres wire protocol proxy for session-based database isolation"
license = "MIT"
repository = "https://github.com/apridosimarmata/astapa"
readme = "README.md"
keywords = ["postgres", "proxy", "database", "sandbox", "testing"]
categories = ["database", "development-tools"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Postgres
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
postgres-protocol = "0.6"
postgres-types = { version = "0.2", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.12"

# SQL parsing
sqlparser = "0.41"                 # Pure Rust, good for most cases
# pg_query = "0.8"                 # TODO: Add for full Postgres compatibility (requires libpg_query)

# HTTP API
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
lru = "0.12"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.5"
async-trait = "0.1"

# Metrics
prometheus = "0.13"
lazy_static = "1.4"

# Config
dotenvy = "0.15"

# HTTP client (for webhooks)
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"
